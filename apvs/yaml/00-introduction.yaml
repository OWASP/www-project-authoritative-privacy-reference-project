# Source of the introduction page (docs/00-introduction.md) and of the status banner shown on every page.
# Tokens replaced when rendering: {version} {total} {l1} {l2} {l3} {appendix_file} {appendix_label}
# Block types inside a section: text, levels, chapters_table, bullets.
introduction:
  version: '0.6'
  title: OWASP Application Privacy Verification Standard
  status:
    headline: APVS version {version}, advanced draft for publication and comments.
    intro_page: >-
      Guidance, verification and the chapter and section introductions are in beta, and the type of each
      requirement is waiting for community comments. The Status section below has the details.
    chapter_pages: >-
      Guidance and verification text (shaded and in italics below) are in beta. Requirement type is waiting
      for community comments, and the chapter and section introductions are in beta as well. Wording will
      keep moving as feedback arrives.
    appendix_page: >-
      This mapping is a working aid for engineers and privacy teams. It follows the requirements as they
      stand in this version and will change with them. It is not legal advice.
  sections:
  - heading: What APVS is
    blocks:
    - text: >-
        The Application Privacy Verification Standard (APVS) is a set of {total} testable requirements
        that describe what an application has to do, technically, to handle personal data responsibly.
        Similar to the OWASP Application Security Verification Standard (ASVS), each requirement
        is a single statement that a verifier can check against code, configuration or a running system,
        and each one carries a level that says how deep the verification needs to go. The requirements
        are anchored to the LINDDUN privacy threat taxonomy and organized around system design and components,
        which keeps the standard close to the way engineers describe their own systems. Legal interpretation
        stays with the people responsible for compliance, and APVS supplies the technical half of that
        conversation.
  - heading: Why it is useful
    blocks:
    - text: >-
        Privacy expectations usually reach development teams as legal text, written for lawyers and open
        to several readings, with no direct way to tell whether a given system meets them. APVS turns
        those expectations into statements that an engineer can implement and a reviewer can test, so
        a design review, a threat model or a penetration test can cover privacy alongside security. Teams
        get a shared vocabulary and a common scope, assessors get a baseline they can apply consistently
        from one system to the next, and organizations can choose a level for each system and track their
        progress against it. Security controls such as access control and encryption are already covered
        by ASVS, so APVS refers to those requirements and restates them only where a privacy perspective
        adds something new.
  - heading: Who it is for
    blocks:
    - text: >-
        Developers and architects can use the standard while they design and build, since the requirements
        describe concrete capabilities such as a personal data catalog, enforced retention or a consent
        record. Security engineers and testers use the verification text to plan their checks, and privacy
        engineers and auditors use the levels and the regulatory mapping to relate application behavior
        to legal obligations. Product owners and procurement teams can cite it as well, for instance by
        asking a vendor to meet Level 2 for a given application.
  - heading: How to use it
    blocks:
    - text: Start by choosing a level for the application.
    - levels:
      - level: L1
        meaning: Basic hygiene, the minimum bar
        needs: Inspection of documentation, code and configuration
      - level: L2
        meaning: Standard baseline
        needs: Access to the running system and its configuration
      - level: L3
        meaning: Applications that handle sensitive data at scale
        needs: Active testing of the running system
    - text: >-
        The three levels describe how much verification an application warrants and do not form a maturity
        model, so applications in the same organization can sensibly sit at different levels. Each requirement
        also has a type. `APP` requirements are assessed for every application on its own, while `SYS`
        requirements describe infrastructure or platform capabilities that can be assessed once and relied
        on by all the applications running on that platform.
    - text: >-
        Chapter 1 is the natural starting point, because the data inventory, purpose records and data
        flow documentation it asks for are what the later chapters refer to when they talk about data
        elements, purposes and processing operations. Every requirement page has the same shape. The requirement
        is the normative statement, the guidance explains scope, examples and edge cases, and the verification
        text tells a reviewer how to confirm that the requirement is met. A privacy team that starts from
        a regulation can use the [regulatory mapping appendix]({appendix_file}) to find the requirements
        that support a GDPR article or a CCPA/CPRA provision, and to find the provisions behind any requirement.
  - heading: What is inside
    blocks:
    - chapters_table: true
    - text: >-
        The chapters are followed by an appendix. [{appendix_label}]({appendix_file}) relates GDPR articles
        and CCPA/CPRA provisions to these requirements and sits outside the numbered chapters.
  - heading: Status
    blocks:
    - text: >-
        Version {version} is an advanced draft, published for review and comment. The requirements are
        ready to be applied and challenged in earnest, and their wording and numbering can still change
        as comments arrive. Guidance and verification text are in beta and appear shaded and in italics
        throughout the chapters, so that nobody mistakes them for settled text. The chapter and section
        introductions are in beta as well. The type of each requirement, `APP` or `SYS`, is waiting for
        comments from the community and may be reassigned.
  - heading: Contributing
    blocks:
    - text: >-
        The standard is developed in the open, and review from people who build, test and audit applications
        is what moves it forward. The source of every chapter is a YAML file, and the pages here are generated
        from those files, so a change proposed against the YAML reaches every page at once. Comments,
        questions and suggestions are welcome as issues in the project repository, and concrete wording
        changes are welcome as pull requests.
    - text: Contributions that help most are
    - bullets:
      - >-
        review of requirement wording for clarity, testability and a positive, prescriptive phrasing,
      - >-
        opinions on whether a requirement should be typed `APP` or `SYS`, and on the level it is assigned,
      - >-
        improvements to guidance and verification text, especially practical examples and edge cases found
        in real assessments,
      - >-
        gaps and overlaps, including requirements that duplicate ASVS or that need a privacy perspective
        added,
      - >-
        experience reports from applying the standard to a real system, including requirements that proved
        hard to verify, and
      - additions to the regulatory mapping appendix, such as further privacy laws.
