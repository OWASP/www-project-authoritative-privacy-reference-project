chapter:
  number: 4
  slug: transparency-notice
  title: Transparency & Notice
  summary: This chapter covers how an application tells people what happens to their personal data, how it asks for and records their consent, and how it lets them see and change their privacy settings. It exists so that the information and choices offered to data subjects are accurate, timely and usable, and so that they can be verified.
  preface: |-
    People can only exercise control over their personal data if they know what is happening to it and can act on that knowledge. This chapter treats transparency as a property of the application itself, something built into screens, APIs, settings and release processes, and therefore something a tester can check. It guards against two failures in particular, a system that collects more than people realize and a set of choices that look real but change nothing.

    The first principle is that a notice must be specific and must arrive at the right moment. A notice shown before collection, scoped to the processing activity at hand, and stating categories, purposes, retention and recipients in concrete terms gives a person something to decide on. Because notices are sometimes read by software as well as by people, they should be machine accessible as well as human readable, and each version should be recorded so that it is always possible to say what a given person was shown on a given day.

    The second principle is that consent is only worth recording if it was freely given through an interface that describes it accurately. Accepting and declining need equal prominence and equal effort, optional processing starts switched off, and each purpose is asked about separately with wording that describes the real consequences of each choice. Withdrawal sits in the same place as the original choice, and the record of each decision ties it to the notice version that was on screen at the time. Developers can verify most of this by loading the interface and comparing the two paths side by side.

    The third principle is that a privacy setting is a statement about processing, so the processing must match it. A toggle that updates a database flag while a pipeline carries on regardless is worse than no toggle, because it creates false assurance. Settings should be easy to find, labeled consistently wherever they appear, gathered in one dashboard, and wired through to the components that actually process data. When defaults change after an update or a migration, or when the processing itself changes materially, the people affected hear about it before it takes effect.

    Chapter 1 supplies the data map that notices and recipient disclosures are checked against, and Chapter 5 covers the features through which people act on what they have learned here.
  sections:
  - id: '4.1'
    title: Notice
    explanation: Notices are the application's account of what it does with personal data, so this section covers when they appear, how specific they are, what they must contain, and how people hear about changes and about data obtained from other sources. Most requirements can be checked by comparing the notice text with what the system actually does.
    requirements:
    - id: 4.1.1
      title: Privacy notice at collection
      requirement: The system must present a privacy notice at or before the point of personal data collection, explaining in plain language what personal data is collected, how it is used, and how it is protected.
      guidance: |-
        The notice must precede collection — it cannot be presented after data has been submitted.

        this must be human readable and machine accessible as well, eg for collection via API or LLM scraping etc.

        Privacy notice must be versioned, and every changed version recorded.
      verification: 'Inspect: walk the user journey to each collection point and confirm a notice is present before data is submitted. Any collection point without a preceding notice is a finding.'
      level: L1
      type: APP
    - id: 4.1.2
      title: Contextual notice per processing activity
      requirement: Privacy notice must be presented at the granularity of the processing activity. A single global privacy policy does not satisfy notice requirements for individual collection points.
      guidance: Each distinct processing activity requires its own contextual notice.
      verification: 'Inspect: confirm each distinct collection point has contextual notice specific to that activity — a link to a general policy without contextual information is a finding.'
      level: L2
      type: APP
    - id: 4.1.3
      title: Notice content — required fields
      requirement: 'The privacy notice must state, for each processing activity: (a) the personal data categories collected; (b) the processing purpose; (c) the retention period or criteria; (d) whether data is shared with third parties and if so, which categories of recipient.'
      guidance: Generic statements such as "to improve our service" do not satisfy field (b).
      verification: 'Inspect: review notice content against the four required fields. Any field absent or populated with a generic placeholder is a finding.'
      level: L1
      type: APP
    - id: 4.1.4
      title: Named third-party recipients
      requirement: Where personal data is shared with third parties, the privacy notice must identify the actual named recipients where practicable. Where only categories of recipients are provided, the category must specify the type, sector, and location of recipients with sufficient specificity to be meaningful.
      guidance: '"Third parties" includes all recipients — not just external companies but also joint controllers and processors. Generic categories such as "trusted partners" do not satisfy this requirement.'
      verification: 'Inspect: review notice recipient disclosures against actual data sharing flows (cross-reference 1.4.1). Generic or unspecific recipient descriptions are findings.'
      level: L3
      type: APP
    - id: 4.1.5
      title: Retention period specificity in notice
      requirement: The privacy notice must state a specific retention period for each data category and processing purpose, or where a fixed period cannot be stated, the criteria used to determine it. A generic statement that data will be retained as long as necessary does not satisfy this requirement.
      guidance: Different categories and purposes may have different periods; each must be stated.
      verification: 'Inspect: review notice retention disclosures and compare to the application definition or configuration. Incorrect specficiation in the notice is a finding.'
      level: L2
      type: APP
    - id: 4.1.6
      title: Notice for indirectly collected data
      requirement: Where personal data is collected from a source other than the data subject, the system must provide notice to the data subject within a reasonable period and no later than a defined and disclosed maximum period, or at the point of first communication if earlier.
      guidance: Addresses indirect data collection flows — third-party data brokers, public sources, other controllers.
      verification: 'Test: identify indirect data collection flows in the system (cross-reference 1.4.1). Confirm a notice delivery mechanism exists with a documented timeline, as well as a process to trigger this mechansim. Absence of mechanism, timeline, or process is a finding.'
      level: L2
      type: SYS
    - id: 4.1.7
      title: Material change notification
      requirement: The system must notify data subjects when a material change occurs to the processing of their personal data - including addition of new processing purposes, new third-party recipients, or changes to retention periods - before the change takes effect.
      guidance: '"Material change" includes: new processing purpose, change of controller identity, change to how rights can be exercised. Non-material changes (spelling corrections, style changes) do not require notification. Notification must precede the change, not accompany it.'
      verification: 'Inspect: confirm a process exists to send notification to all affected data subjects before deploying a new version or configuration that implements one of these changes. A lack of process or enforced checklist is a finding.'
      level: L2
      type: SYS
    - id: 4.1.8
      title: Automated decision-making disclosure
      requirement: 'Where the system performs automated decision-making for a data subject, the privacy notice must disclose: (a) the existence of the automated processing; (b) the logic involved; (c) the significance and envisaged consequences for the data subject.'
      guidance: The disclosure must be specific enough that the data subject can understand the consequences — "we use algorithms to personalise your experience" does not satisfy (b) or (c).
      verification: 'Inspect: identify automated decision-making processing activities. Confirm the three required disclosure components exist in the notice for each. Any missing component is a finding.'
      level: L1
      type: APP
  - id: '4.2'
    title: Consent Interface
    explanation: Consent interfaces are where a person's decision is captured, and design choices there can quietly steer that decision. This section sets out the properties that make a consent interaction a genuine choice, covering equal presentation of options, separate asks per purpose, accurate framing, easy withdrawal, and a reliable record of what was agreed.
    requirements:
    - id: 4.2.1
      title: Visual parity of privacy choices
      requirement: |-
        Accept and reject options in consent interfaces must have equal visual prominence. Size, colour, contrast, and placement must not direct attention toward privacy-invasive options or away from privacy-protective ones.
        Accepting must not require fewer steps than rejecting.
      guidance: 'Equal prominence covers: size, colour weight, contrast ratio, and placement. Neither option may be visually de-emphasised relative to the other. Step count parity is the minimum — reject must not require more clicks, screens, or confirmations than accept.'
      verification: |-
        Inspect: review consent interface for visual asymmetry between accept and reject options. Any difference in size, colour weight, contrast, or placement that favours acceptance is a finding. Count steps to accept vs reject — any asymmetry is a finding.

        Inspect: measure size, colour contrast, and placement of accept vs reject options. Any asymmetry that favours acceptance is a finding.
      level: L1
      type: APP
    - id: 4.2.2
      title: No pre-selection or inaction consent
      requirement: Consent must not be pre-selected or inferred from inaction. The default state of all consent controls must be unchecked or off, and require a user to opt-in, not to opt-out.
      guidance: 'Pre-selection includes: pre-ticked checkboxes, toggles defaulting to on, and any design where the privacy-invasive option is active without explicit user action. Scrolling past a notice, closing a banner, or continuing to use the service does not constitute consent.'
      verification: 'Test: load the consent interface without interaction and confirm all optional processing controls are off by default. Any pre-selected option is a finding.'
      level: L1
      type: APP
    - id: 4.2.3
      title: Consent granularity — one purpose per consent act
      requirement: 'Consent must be obtainable separately for each distinct processing purpose. A layered consent interface may be used to reduce interaction burden: a first layer may present a summary choice — accept all or reject all — provided that a second layer offering per-purpose granular controls is reachable in no more steps, and with no less visual prominence, than the summary choice. Accepting one purpose must not be conditional on accepting another, at either layer.'
      guidance: Each purpose requires its own consent interaction — an "accept all" option may be provided alongside granular controls but must not substitute for them.
      verification: 'Inspect: review consent flow for bundling of multiple purposes into a single consent act. Any single checkbox or confirmation covering more than one purpose is a finding.'
      level: L1
      type: APP
    - id: 4.2.4
      title: Consent separable from other matters
      requirement: Where consent is requested alongside other declarations (e.g. terms of service, account registration), the consent request must be clearly distinguishable from those other matters, presented separately, and in plain language.
      guidance: Consent embedded within terms and conditions is invalid. Visual and structural separation is required — consent must not be continuous with surrounding non-consent content.
      verification: 'Inspect: review consent collection points for bundling with non-consent content. Any consent request not visually and structurally separated from surrounding content is a finding.'
      level: L1
      type: APP
    - id: 4.2.5
      title: Consent withdrawal
      requirement: Withdrawing consent must be as easy as giving it and must be accessible from the same context in which consent was given.
      guidance: '"As easy as giving it" means the same number of steps and the same channel. A consent given via a toggle must be withdrawable via the same toggle. Withdrawal must not require navigating to a separate settings area, contacting support, or sending a written request.'
      verification: 'Test: follow the withdrawal path and confirm it requires no more steps than the consent path and is reachable from the same UI context. Any asymmetry in step count or channel is a finding.'
      level: L2
      type: APP
    - id: 4.2.6
      title: Consent record
      requirement: 'The system must record for each consent transaction: (a) the identity of the data subject; (b) the timestamp; (c) the processing purpose consented to; (d) the version of the notice presented; (e) the mechanism by which consent was given. This record must be retained for the duration of the processing plus the applicable limitation period.'
      guidance: |-
        The controller must be able to demonstrate that consent was obtained. The record must capture what was shown to the data subject, not just that consent was given — version of notice is critical for this.

        For delegated DSRs, the consent should note who consented for whom.
      verification: 'Inspect: request the consent record for a known data subject and confirm all five components are present. Test: confirm the record is generated automatically at the point of consent, not retrospectively.'
      level: L2
      type: SYS
    - id: 4.2.7
      title: No forced consent for core functionality
      requirement: The system must not require consent to non-essential processing as a condition of accessing core functionality, where that processing is not strictly necessary for the functionality requested.
      guidance: A feature that functions without the processing but gates access on consent is a finding.
      verification: 'Test: attempt to use core functionality without consenting to non-essential processing. Any blocking of core functionality conditional on non-essential consent is a finding.'
      level: L2
      type: APP
    - id: 4.2.8
      title: No pre-consent cookie initialisation
      requirement: Where cookies or equivalent tracking technologies are used for non-essential purposes, no such technology must be initialised before a consent signal is received and recorded.
      guidance: Non-essential cookies include analytics, advertising, and personalisation trackers. Essential cookies (session management, security) are exempt.
      verification: 'Test: inspect network traffic and browser storage before any consent interaction. Any non-essential cookie or tracker present before a consent signal is a finding.'
      level: L2
      type: APP
    - id: 4.2.9
      title: Representative Framing of Privacy Choices
      requirement: The interface must not misrepresent the necessity, urgency, or social validation of a privacy-related choice in a way that pressures the data subject toward a particular outcome.
      guidance: |-
        Confirmshaming, false necessity, and fabricated urgency are distinct techniques with a shared mechanism: each misrepresents a fact — what is required, what happens if you decline, or how others are behaving — to pressure a privacy decision the interface's true state doesn't support.

        Known manifestations include, without limitation:
        • False necessity — designating a field as required, mandatory, or blocking empty submission where the underlying data does not satisfy the necessity test.
        • Guilt or shame framing — labeling rejection or a privacy-protective choice in negative, guilt-inducing, or emotionally manipulative language.
        • Fabricated urgency or social proof — presenting scarcity signals, countdown timers, or claims about other users' behavior near a consent or privacy decision that are not verifiably true and current.
        This list is illustrative, not exhaustive — new manifestations of the same underlying pattern are covered by the general requirement even where not enumerated here.
      verification: Inspect the interface presented at each privacy-related choice point for claims or framing that do not reflect the system's actual state — including necessity, urgency, and social validation claims. Any such claim that misrepresents the actual state is a finding.
      level: L1
      type: APP
    - id: 4.2.10
      title: No nagging
      requirement: The system must not re-prompt a data subject for consent to non-essential processing which they have already declined, within the same session or across sessions, unless the processing purpose or legal basis has materially changed.
      guidance: A "material change" is a genuine change to the nature of the processing — not a cosmetic reframing of the same request. Re-prompting with different wording for the same purpose is a finding.
      verification: 'Test: decline consent and continue using the system across multiple sessions. Any re-prompt for the same purpose without a documented material change is a finding.'
      level: L1
      type: APP
  - id: '4.3'
    title: Privacy Settings
    explanation: Privacy settings let people review and change their choices after the first interaction. This section covers whether those settings can be found, whether they behave the same everywhere, whether they reflect and control the processing that really takes place, and whether the person can see the overall effect of their configuration.
    requirements:
    - id: 4.3.1
      title: Privacy settings discoverability
      requirement: Privacy settings must be directly accessible through standard system menus or settings, without requiring contact with support, submission of a request, or navigation to an external system.
      guidance: |-
        "Standard system menus" means the settings or account menu a user would naturally navigate to. Privacy settings must not require knowledge of a direct URL, a support interaction, or a search to locate. WCAG AA contrast ratios apply. "Outside normal reading flow" means positioned where a user following standard reading patterns (top to bottom, left to right) would not encounter it.

        Privacy settings must not be hidden, rendered in low contrast, positioned outside normal reading flow, or otherwise visually de-emphasised relative to non-privacy interface elements.
      verification: |-
        Inspect: attempt to locate privacy settings from the main interface using only standard navigation. Inability to reach settings within two navigational steps from any screen is a finding.

        Inspect: review privacy control visibility against WCAG AA contrast ratios and reading flow positioning. Any control failing contrast requirements or positioned to reduce discoverability is a finding.
      level: L1
      type: APP
    - id: 4.3.2
      title: Functional privacy settings
      requirement: The system must not present privacy settings that are non-functional, misleading, or have no effect on actual data processing.
      guidance: The most common failure mode is a consent UI that appears functional but does not propagate changes to the backend processing system. Controls that update a UI state without affecting actual processing are a finding.
      verification: 'Test: activate each privacy setting and confirm the corresponding processing stops. Inspect backend processing state after each change. Settings with no observable effect on processing are a finding.'
      level: L2
      type: APP
    - id: 4.3.3
      title: Consistent privacy settings
      requirement: Privacy settings must use consistent labels, placement, language, and behaviour throughout the system. A setting that affects a given processing activity in one context must operate identically in all contexts where that processing occurs.
      guidance: |-
        A toggle that disables tracking on one screen must not re-enable it on another. Labels must be identical across contexts — different phrasing for the same control is a finding.

        Consent and preference interfaces must not use double negatives, ambiguous phrasing, or language that obscures the consequence of the choice. The consequence of each option must be unambiguously determinable from the label alone.
      verification: |-
        Inspect: review privacy settings across all system screens. Any inconsistency in label, placement, or functional behaviour is a finding.

        Inspect: review consent and preference label language. Any option where the outcome requires interpretation or inference to understand is a finding.
      level: L2
      type: APP
    - id: 4.3.4
      title: Privacy settings reflect actual processing state
      requirement: |-
        Privacy settings must reflect the actual current state of processing. Where a setting is shown as off, the corresponding processing must not be occurring.
        Changes made to the privacy settings must take effect on actual processing immediately or within a technically justified and disclosed maximum period.
      guidance: 'The two obligations are distinct: (a) changes must propagate to actual processing; (b) the dashboard display must reflect the updated state. Both must be satisfied — a dashboard that updates its display without affecting processing, or that affects processing without updating its display, is a finding.'
      verification: 'Test: set a processing preference to off and inspect actual system processing. Confirm the setting reflects the live processing state at all times. Any divergence between displayed state and actual processing is a finding.'
      level: L2
      type: SYS
    - id: 4.3.5
      title: Settings reset notification
      requirement: Where privacy settings are reset — for example following an app update, account migration, or system change — the data subject must be notified of the reset and given the opportunity to review settings before processing resumes under the new defaults.
      guidance: ''
      verification: 'Test: simulate a system update that resets privacy settings. Confirm notification is triggered and settings review is offered before processing resumes. Absence of notification mechanism is a finding.'
      level: L2
      type: SYS
    - id: 4.3.6
      title: Privacy dashboard existence
      requirement: 'The system must provide a privacy dashboard through which data subjects can view and modify all their privacy settings in a single accessible interface, including: active consent states, processing purposes, and communication preferences.'
      guidance: |-
        The dashboard must be a single point of access — fragmented privacy settings spread across multiple menus do not satisfy this requirement. "View and modify" are both required — a read-only dashboard does not satisfy the modification obligation.

        this is an overall interface allowing direct access to all privacy settings, instead of chasing each one seperately on each record, post, field, feature, etc.
      verification: 'Inspect: confirm the dashboard exists and is accessible. Confirm it covers consent states, processing purposes, and communication preferences in a single interface. Absence of any of these three is a finding.'
      level: L2
      type: SYS
    - id: 4.3.7
      title: Privacy report
      requirement: The system must provide data subjects with access to a privacy impact summary showing the consequences of their current privacy settings — including what processing is active, what data is shared, and what would change if settings were modified.
      guidance: 'Think: "Based on your current settings, your location data is shared with 3 advertising partners."'
      verification: 'Inspect: confirm the privacy report or equivalent exists and is accessible from the dashboard. Confirm it reflects current settings state. A static generic report not reflecting the individual''s actual settings is a finding.'
      level: L3
      type: SYS
